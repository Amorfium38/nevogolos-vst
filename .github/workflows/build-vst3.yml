name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-vst3.yml"

permissions:
  contents: read

jobs:
  build-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3" |
            Where-Object { Test-Path (Join-Path $_.FullName "Contents") } |
            Select-Object -First 1
          if (-not $plugin) {
            Write-Error "No .vst3 bundle was found after build."
            Get-ChildItem -Path "build" -Recurse | Select-Object -First 100 FullName
            exit 1
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath "NevGolosVoice-Windows-x64-VST3.zip" -Force
          Write-Host "Packaged plugin: $($plugin.FullName)"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NevGolosVoice-Windows-x64-VST3
          path: NevGolosVoice-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 14
